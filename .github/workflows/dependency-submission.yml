# Submits the Gradle dependency graph so Dependabot alerts and
# dependency-review also cover Android/Kotlin libraries (pub is detected natively).
name: Gradle dependency submission

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gate
        run: echo "has_app=$([[ -f pubspec.yaml ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.gate.outputs.has_app == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.gate.outputs.has_app == 'true'
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: true
      - name: Generate Android Gradle config
        if: steps.gate.outputs.has_app == 'true'
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --config-only
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.gate.outputs.has_app == 'true'
        with:
          build-root-directory: android

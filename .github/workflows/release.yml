name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release # add required reviewers on this environment in repo settings
    permissions:
      contents: write # create the GitHub Release
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag must match pubspec version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+]+).*/\1/')"
          [[ "v$version" == "$TAG" ]] || { echo "::error::Tag $TAG != pubspec version v$version"; exit 1; }

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.6"
          cache: false # no cache for release builds (reproducibility, cache poisoning)

      # Tests run before any signing material touches the disk.
      - name: Test
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --fatal-infos
          flutter test

      - name: Restore signing key (never committed)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          [[ -n "$KEYSTORE_BASE64" ]] || { echo "::error::Signing secrets are missing"; exit 1; }
          umask 077
          keystore="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build signed APK + AAB
        run: |
          flutter build apk --release
          flutter build appbundle --release

      # Gradle falls back to debug signing when key.properties is unusable;
      # a release must never ship like that.
      - name: Refuse debug-signed release
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          certs="$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          if grep -q "CN=Android Debug" <<<"$certs"; then
            echo "::error::Release APK is signed with the debug key"; exit 1
          fi

      - name: Privacy check
        run: bash tool/ci/check_privacy.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Collect artifacts + checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/unscroll-$TAG.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/unscroll-$TAG.aab"
          (cd dist && sha256sum ./*.apk ./*.aab > SHA256SUMS.txt)

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/unscroll-${{ github.ref_name }}.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.apk
            dist/*.aab

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          draft: true # owner reviews and publishes manually
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
